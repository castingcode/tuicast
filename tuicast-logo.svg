<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','Fira Code','JetBrains Mono',Consolas,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7ee787"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>

  <!-- outer card -->
  <rect x="10" y="10" width="880" height="240" rx="22" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- fishing line: cast arcing from the terminal cursor out toward the wordmark -->
  <path d="M 128 118 C 260 40, 420 190, 560 70 C 600 40, 630 55, 648 78"
        fill="none" stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>

  <!-- fly hook + tiny feather at the end of the cast -->
  <g transform="translate(648,78)">
    <path d="M 0 0 C 10 6, 14 18, 4 24 C -4 29, -12 22, -8 14"
          fill="none" stroke="#e3b341" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -2 -3 L -18 -12" stroke="#e3b341" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M -2 -1 L -20 -3" stroke="#e3b341" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M -2 1  L -18 6" stroke="#e3b341" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="3.5" fill="#e3b341"/>
  </g>

  <!-- terminal window -->
  <rect x="42" y="52" width="290" height="156" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="42" y="52" width="290" height="30" rx="12" fill="#21262d"/>
  <rect x="42" y="70" width="290" height="12" fill="#21262d"/>
  <circle cx="62" cy="67" r="5.5" fill="#ff5f56"/>
  <circle cx="80" cy="67" r="5.5" fill="#ffbd2e"/>
  <circle cx="98" cy="67" r="5.5" fill="#27c93f"/>

  <!-- prompt + blinking cursor, line "rod" reads out of the cursor -->
  <text x="60" y="152" font-size="40" font-weight="700" fill="#7ee787">&gt;</text>
  <rect x="112" y="122" width="18" height="34" fill="#7ee787" opacity="0.85"/>

  <!-- a few faint terminal text rows for texture -->
  <rect x="60" y="172" width="120" height="6" rx="3" fill="#30363d"/>
  <rect x="60" y="186" width="80"  height="6" rx="3" fill="#30363d"/>

  <!-- wordmark -->
  <text x="378" y="150" font-size="58" font-weight="700">
    <tspan fill="#e6edf3">tui</tspan><tspan fill="#7ee787">cast</tspan>
  </text>
  <text x="380" y="182" font-size="16" fill="#8b949e" letter-spacing="2">AUTOMATE YOUR TERMINAL</text>
</svg>
