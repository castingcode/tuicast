name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip
          - goos: windows
            goarch: arm64
            archive: zip
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build release archive
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          ARCHIVE: ${{ matrix.archive }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="tuicast_${version}_${GOOS}_${GOARCH}"
          destination="dist/${name}"
          suffix=""
          if [[ "$GOOS" == "windows" ]]; then
            suffix=".exe"
          fi

          mkdir -p "$destination/schema"
          go build -trimpath -ldflags="-s -w" \
            -o "$destination/tuicast-driver${suffix}" ./cmd/tuicast-driver
          go build -trimpath -ldflags="-s -w -X main.version=${version}" \
            -o "$destination/tuicast-mcp${suffix}" ./cmd/tuicast-mcp
          go build -trimpath -ldflags="-s -w" \
            -o "$destination/reference-tui${suffix}" ./cmd/reference-tui
          cp LICENSE "$destination/"
          cp schema/mcp-profiles.schema.json "$destination/schema/"
          cp schema/openrpc.json "$destination/schema/"
          cp schema/workbench-recording.schema.json "$destination/schema/"

          if [[ "$ARCHIVE" == "zip" ]]; then
            (cd dist && zip -qr "${name}.zip" "$name")
          else
            tar -C dist -czf "dist/${name}.tar.gz" "$name"
          fi

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          path: dist/*.${{ matrix.archive }}

  publish-images:
    name: Publish ${{ matrix.name }} image
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: driver
            image: tuicast-driver
            dockerfile: docker/driver.Dockerfile
          - name: reference TUI
            image: tuicast-reference-tui
            dockerfile: docker/reference-tui.Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/castingcode/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=semver,pattern={{major}},value=${{ github.ref_name }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  release:
    name: Create GitHub Release
    needs: [build, publish-images]
    runs-on: ubuntu-latest
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum tuicast_* > checksums.txt

      - name: Create release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease+=(--prerelease)
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --generate-notes "${prerelease[@]}"
          fi
