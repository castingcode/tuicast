name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish-images:
    name: Publish ${{ matrix.name }} image
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: driver
            image: tuicast-driver
            dockerfile: docker/driver.Dockerfile
          - name: reference TUI
            image: tuicast-reference-tui
            dockerfile: docker/reference-tui.Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: castingcode/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=semver,pattern={{major}},value=${{ github.ref_name }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  release:
    name: Publish binaries and packages
    needs: [checks, publish-images]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_PACKAGE_MANAGER_TOKEN: ${{ secrets.GH_PACKAGE_MANAGER_TOKEN }}
          GH_WINGET_PULL_REQUEST_TOKEN: ${{ secrets.GH_WINGET_PULL_REQUEST_TOKEN }}

  publish-npm-cli:
    name: Publish npm CLI installer
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@castingcode/tuicast-cli
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: npm/cli
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install a trusted-publishing npm CLI
        run: npm install --global npm@^11.5.1

      - name: Set package version from release tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm version "$version" --no-git-tag-version

      - name: Test package
        run: npm test

      - name: Publish package
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          tag=latest
          if [[ "$version" == *-* ]]; then
            tag=next
          fi
          if [[ -n "$NPM_TOKEN" ]]; then
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          fi
          npm publish --tag "$tag"
