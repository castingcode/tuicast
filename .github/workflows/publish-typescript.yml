name: Publish TypeScript SDK

on:
  push:
    tags: ["sdk/typescript/v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish TypeScript package to npm
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@castingcode/tuicast
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version-file: sdk/typescript/.nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install a trusted-publishing npm CLI
        run: npm install --global npm@^11.5.1

      - name: Verify tag matches package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#sdk/typescript/v}"
          package_version="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version $tag_version does not match package version $package_version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run clean && npm run build

      - name: Publish package
        run: npm publish
